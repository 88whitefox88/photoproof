# Описание Xcode-проекта для XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Сгенерировать проект на Mac:  brew install xcodegen && xcodegen generate
name: PhotoProof
options:
  bundleIdPrefix: ru.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Впишите свой Team ID (developer.apple.com → Membership), чтобы ставить на iPhone.
    DEVELOPMENT_TEAM: ""
targets:
  PhotoProof:
    type: application
    platform: iOS
    sources:
      - path: PhotoProof
    settings:
      base:
        # Уникальный идентификатор приложения. Не меняйте его после первой установки —
        # иначе iPhone посчитает приложение новым и снимки останутся в старом.
        PRODUCT_BUNDLE_IDENTIFIER: ru.fotodokaz.k7m2q9
        PRODUCT_NAME: PhotoProof
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  PhotoProof:
    build:
      targets:
        PhotoProof: all
    run:
      config: Debug
    archive:
      config: Release
